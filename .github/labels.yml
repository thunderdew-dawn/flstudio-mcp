    color: a2eeef
    description: User experience.

  - name: priority:p0
    color: b60205
    description: Critical priority; should be handled immediately.
  - name: priority:p1
    color: d93f0b
    description: High priority; important follow-up work.
  - name: priority:p2
    color: fbca04
    description: Medium priority; useful but not urgent.
  - name: priority:p3
    color: ededed
    description: Low priority.
  - name: P0
    color: b60205
    description: Critical priority (alias).
  - name: P1
    color: d93f0b
    description: High priority (alias).

  - name: status:needs-triage
    color: ededed
    description: Needs initial maintainer review and classification.
  - name: status:blocked
    color: 000000
    description: Cannot proceed until an external dependency or decision is resolved.
  - name: status:ready
    color: 0e8a16
    description: Ready for implementation or review.

  - name: release-blocker
    color: b60205
    description: Must be resolved before the next release.
  - name: release:skip
    color: cfd3d7
    description: Skip in release notes.
  - name: breaking-change
    color: b60205
    description: Introduces a breaking change.

  - name: dependencies
    color: 0366d6
    description: Dependency update generated manually or by automation.
  - name: api-dependent
    color: 1d76db
    description: Depends on FL Studio or external API behavior.
  - name: api-limited
    color: fbca04
    description: Limited by known API constraints.

  - name: safety
    color: fbca04
    description: Safety task.
  - name: rollback
    color: fbca04
    description: Rollback behavior.
  - name: documentation
    color: 0075ca
    description: Documentation update.
  - name: ux
    color: a2eeef
    description: UX design.
  - name: onboarding
    color: a2eeef
    description: Onboarding improvements.
  - name: support
    color: ededed
    description: Support request.
  - name: read-only
    color: cfd3d7
    description: Read-only script.
  - name: dry-run-only
    color: cfd3d7
    description: Dry run only script.
  - name: write-safe-required
    color: fbca04
    description: Requires safe write guarantees.
  - name: "*"
