[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fls-pilot"
version = "3.0.0b3"
description = "Create more. Check less. Local FL Studio Control Center and MCP workflow assistant for safe mix reviews, routing audits, project cleanup, low-end checks, export readiness, and rollback-first assisted edits."
readme = "README.md"
license = { text = "MIT" }
authors = [
{ name = "rosasynthesiz" },
]
maintainers = [
{ name = "thunderdew-dawn" },
]
requires-python = ">=3.10,<3.13"
keywords = ["mcp", "fl-studio", "music-production", "ai", "claude", "fruityloops"]
classifiers = [
"Development Status :: 4 - Beta",
"Intended Audience :: Developers",
"Intended Audience :: End Users/Desktop",
"License :: OSI Approved :: MIT License",
"Operating System :: Microsoft :: Windows",
"Operating System :: MacOS",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Topic :: Multimedia :: Sound/Audio",
"Topic :: Multimedia :: Sound/Audio :: MIDI",
"Topic :: Multimedia :: Sound/Audio :: Mixers",
]
dependencies = [
"fastmcp>=2.0.0",
"pydantic>=2.7.0",
"mido>=1.3.2",
"python-rtmidi>=1.5.8",
"pyautogui>=0.9.54",  # piano-roll script trigger (Ctrl+Alt+Y / Cmd+Opt+Y)
"pygetwindow>=0.0.9; sys_platform == 'win32'",  # Windows focus helper (unused on macOS)
]

[project.optional-dependencies]
dev = [
"pytest>=8.0",
"pytest-asyncio>=0.23",
"ruff>=0.5",
]
docs = [
"mkdocs>=1.6",
"mkdocs-material",
"pymdown-extensions",
]

# Audio analysis v2: deterministic mix evidence for user-provided or manually

# bounced audio files. Does not imply FL Studio render/open/save automation.

audio = [
"numpy>=1.26",
"scipy>=1.11",
"soundfile>=0.13",
"pyloudnorm>=0.1.1",
"soxr>=0.5",
]

# Optional MIR helpers for onset/chroma/tempo-style analysis.

# Keep separate from core mix evidence.

audio-mir = [
"librosa>=0.11",
]

# Higher-accuracy melody/pitch via CREPE (torchcrepe). HEAVY: pulls torch

# (~500MB on disk, slower on CPU). Install ALONGSIDE [audio] and optionally

# [audio-mir], e.g.

# pip install -e .[audio,audio-mir,audio-accurate]

# Without it, fl_extract_melody falls back to the lighter pyin engine.

audio-accurate = [
"torch>=2.0",
"torchcrepe>=0.0.23",
]

[project.scripts]
fls-pilot = "fls_pilot.server:main"
fls-pilot-control-center = "fls_pilot.control_center:main"
fls-pilot-daemon = "fls_pilot.daemon:main"
fls-pilot-status = "fls_pilot.status:main"
fls-pilot-doctor = "fls_pilot.doctor:main"

[project.urls]
Homepage = "https://github.com/thunderdew-dawn/fls-pilot"
Repository = "https://github.com/thunderdew-dawn/fls-pilot"
Issues = "https://github.com/thunderdew-dawn/fls-pilot/issues"
Upstream = "https://github.com/rosasynthesiz/flstudio-mcp"

[tool.hatch.build]
include = [
"/src/fls_pilot/**/*.py",
"/src/fls_pilot/context/**/*.md",
"/src/fls_pilot/context/**/*.json",
"/src/fls_pilot/context/**/*.yaml",
"/src/fls_pilot/context/**/*.yml",
"/knowledgebase/**/*.md",
"/knowledgebase/**/*.json",
"/knowledgebase/**/*.yaml",
"/knowledgebase/**/*.yml",
"/docs/**/*.md",
"/README.md",
"/LICENSE",
]
exclude = [
"/.github/**",
"/.gitignore",
"/.pytest_cache/**",
"/.ruff_cache/**",
"/agent-docs/**",
"/dist/**",
"/docs/community/**",
"/docs/requirements.txt",
"/knowledgebase/agent_notes/**",
"/scratch/**",
"/scripts/calibration/**",
"/scripts/probes/**",
"/tests/**",
"/src/fls_pilot/context/prompts/api-probe.md",
"/src/fls_pilot/context/prompts/bug-triage.md",
"/src/fls_pilot/context/prompts/implementation-slice.md",
"/src/fls_pilot/context/prompts/release.md",
"**/**pycache**/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fls_pilot"]
force-include = { "knowledgebase" = "knowledgebase" }

[tool.hatch.build.targets.sdist]
only-include = [
"src",
"knowledgebase",
"docs",
"README.md",
"LICENSE",
"pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["UP031"]
"tests/**/*.py" = ["UP031", "E501"]

[tool.pytest.ini_options]
addopts = """
--ignore=scratch
--ignore=tests/test_autoopen.py
--ignore=tests/test_channel_target.py
--ignore=tests/test_compression_intents.py
--ignore=tests/test_mixing_intents.py
--ignore=tests/test_reverb_delay_intents.py
--ignore=tests/test_route_write.py
--ignore=tests/test_routing_read.py
--ignore=tests/test_audio_analysis.py
--ignore=tests/test_melody_extract.py
--ignore=tests/test_reference_match.py
--ignore=scripts/probes/test_priority12_live.py
"""
norecursedirs = ["scratch", ".venv", ".git", ".pytest_cache", ".ruff_cache"]
