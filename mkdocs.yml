site_name: fls-pilot
site_description: Create more. Check less. Local FL Studio Control Center and MCP workflow assistant .
site_url: https://fl-studio-pilot.readthedocs.io/en/latest/

repo_name: thunderdew-dawn/fls-pilot
repo_url: https://github.com/thunderdew-dawn/fls-pilot
edit_uri: edit/v3/alpha/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  agents/**
  concepts/**
  engineering/**
  project/**

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Setup: user-guide/setup.md
  - Control Center: control-center.md
  - Workflows: user-guide/workflows.md
  - Prompt Examples: user-guide/prompts.md
  - Safety & Limits: safety-limits.md
  - MCP Integration: mcp-integration.md
  - Community:
      - Support: community/support.md
      - Security: community/security.md
      - Contributing: community/contributing.md
      - Code of Conduct: community/code-of-conduct.md
      - Notice: community/notice.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search

strict: true
